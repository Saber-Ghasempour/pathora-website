<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Play a shared puzzle · Pathora</title><link rel="stylesheet" href="/style.css"><style>main{max-width:620px;margin:10vh auto;padding:24px}textarea{box-sizing:border-box;width:100%;height:150px;border:1px solid #557779;border-radius:12px;padding:14px;word-break:break-all}button,.play{display:inline-block;margin:12px 8px 12px 0;padding:14px 22px;border:0;border-radius:12px;background:#176b73;color:white;font:inherit;text-decoration:none}#error{color:#ae3629}</style></head>
<body><main><a href="/">PATHORA</a><h1>A puzzle from a friend</h1><p id="details">Open this link on your Android phone to play the same puzzle from the start.</p><p id="error"></p><a id="open" class="play" href="#">Open in Pathora</a><a class="play" href="https://play.google.com/store/apps/details?id=com.afsanora.pathora">Get Pathora</a><p>If the app doesn't open, copy this code and choose <strong>Open a shared puzzle</strong> on the game's main menu. After installing, return to this link.</p><textarea id="code" readonly aria-label="Puzzle code"></textarea><button id="copy">Copy puzzle code</button><p id="status" role="status"></p><p><a href="/privacy/">Privacy policy</a></p></main>
<script>
(()=>{'use strict';const code=new URLSearchParams(location.search).get('p')||'';const out=document.getElementById('code');
try{if(!code||code.length>2048||!/^[A-Za-z0-9_-]+$/.test(code))throw Error();const p=JSON.parse(atob(code.replace(/-/g,'+').replace(/_/g,'/')));if(p.version!==1||p.generator!==1||p.mask!==1||!Number.isInteger(p.width)||p.width<10||p.width>100||!Number.isInteger(p.height)||p.height<10||p.height>100||!Number.isInteger(p.difficulty)||p.difficulty<0||p.difficulty>3)throw Error();
out.value=code;document.getElementById('details').textContent=p.shape+' · '+p.width+' × '+p.height+' · '+['Easy','Medium','Hard','Extreme'][p.difficulty]+'. The timer waits until you press Start.';
document.getElementById('open').href='intent://pathora.afsanora.com/challenge/?p='+encodeURIComponent(code)+'#Intent;scheme=https;package=com.afsanora.pathora;end';
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);document.getElementById('status').textContent='Copied.';}catch{out.select();document.getElementById('status').textContent='Select and copy the code above.';}};
}catch{document.getElementById('error').textContent='This puzzle link is invalid or needs a newer version.';document.getElementById('open').hidden=true;document.getElementById('copy').hidden=true;out.hidden=true;}})();
</script></body></html>
